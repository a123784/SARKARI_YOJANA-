<style>

  *{box-sizing:border-box;margin:0;padding:0}

  header{background:linear-gradient(135deg,var(--navy),#1e40af);color:#fff;padding:28px 20px 90px;position:relative}
  .head-top{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
  .lang{display:flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px}
  .lang button{background:none;border:0;color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
  .lang button.on{background:#fff;color:var(--navy)}
  .hero{max-width:760px;margin:26px auto 0;text-align:center}
  .hero h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.5px}
  .hero p{margin-top:12px;font-size:16px;opacity:.92}
  main{max-width:1080px;margin:-62px auto 0;padding:0 16px 40px;position:relative}
  .filters{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.12);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;align-items:end}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  select,input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff;color:var(--text);font-family:inherit}
  select:focus,input:focus{outline:2px solid var(--blue);border-color:transparent}
  .btn{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;color:var(--text)}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
  .tabs{display:flex;background:#e8edf5;border-radius:14px;padding:4px;gap:2px}
  .tabs button{border:0;background:none;padding:9px 16px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;font-family:inherit}
  .tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .count{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.1);border-color:#c7d2fe}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
  .tag.state{background:#fff4e5;color:var(--state)}
  .tag.cat{background:#f1f5f9;color:var(--muted)}
  .card h3{font-size:17px;line-height:1.3}
  .card p{font-size:14px;color:var(--muted);flex:1}
  .more{font-size:14px;font-weight:700;color:var(--blue)}
  .empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:26px;position:relative}
  .close{position:absolute;top:14px;right:16px;border:0;background:#f1f5f9;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
  .modal h2{font-size:22px;margin:10px 40px 6px 0;line-height:1.3}
  .modal .sum{color:var(--muted);margin-bottom:14px}
  .modal h4{margin:16px 0 6px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--blue)}

  .modal li{margin:3px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .primary{background:var(--blue);color:#fff;border:0;text-decoration:none;display:inline-block}
  .primary:hover{background:#1e40af}
  footer{max-width:1080px;margin:0 auto;padding:22px 16px 40px;text-align:center;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line)}
</style>
</head>

</div>

/* ============================================================
   3) APP LOGIC
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let lang = "en";
let tab = "all";
try { lang = localStorage.getItem("sarkari_lang") || "en"; } catch(e){}
if (!I18N[lang]) lang = "en";

function t(){ return I18N[lang]; }

/* ---- static text ---- */
function renderStatic(){
  const T = t();
  document.documentElement.lang = lang;
  $("t-pill").textContent = T.pill;
  $("t-sub").textContent = T.sub;
  $("t-state").textContent = T.selState;
  $("t-cat").textContent = T.selCat;
  $("t-search").textContent = T.search;
  $("q").placeholder = T.ph;
  $("reset").textContent = T.reset;
  $("t-ben").textContent = T.ben;
  $("t-eli").textContent = T.eli;
  $("t-doc").textContent = T.doc;
  $("m-portal").textContent = T.portal;
  $("m-copy").textContent = T.copy;
  $("t-disc").innerHTML = T.disc;
  const tabBtns = $("tabs").querySelectorAll("button");
  tabBtns[0].textContent = T.all;
  tabBtns[1].textContent = T.central;
  tabBtns[2].textContent = T.state;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}

/* ---- dropdowns (keeps current selection) ---- */
function renderSelects(){
  const T = t();
  const sv = $("state").value || "ALL";
  const cv = $("cat").value || "ALL";
  $("state").innerHTML = `<option value="ALL">${esc(T.allStates)}</option>` +
    Object.keys(STATES).map(k => `<option value="${k}">${esc(STATES[k][lang])}</option>`).join("");
  $("cat").innerHTML = `<option value="ALL">${esc(T.allCats)}</option>` +
    Object.keys(CATS).map(k => `<option value="${k}">${esc(CATS[k][lang])}</option>`).join("");
  $("state").value = sv;
  $("cat").value = cv;
}

/* ---- filtering ---- */
function getFiltered(){
  const st = $("state").value;
  const ct = $("cat").value;
  const q = $("q").value.trim().toLowerCase();
  return SCHEMES.filter(s => {
    // when a state is chosen, show Central schemes + that state's schemes
    if (st !== "ALL" && s.state !== "CENTRAL" && s.state !== st) return false;
    if (ct !== "ALL" && s.cat !== ct) return false;
    if (tab === "central" && s.state !== "CENTRAL") return false;
    if (tab === "state" && s.state === "CENTRAL") return false;
    if (q){
      const hay = [s.name, s.summary, ...s.benefits, ...s.eligibility, STATES[s.state]?.en || "", CATS[s.cat].en].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderGrid(){
  const T = t();
  const list = getFiltered();
  $("count").textContent = T.count(list.length);
  if (!list.length){
    $("grid").innerHTML = `<div class="empty">${esc(T.none)}</div>`;
    return;
  }
  $("grid").innerHTML = list.map(s => {
    const isC = s.state === "CENTRAL";
    const badge = isC ? T.badgeC : STATES[s.state][lang];
    return `<article class="card" data-id="${s.id}" tabindex="0">
      <div class="tags">
        <span class="tag ${isC ? "" : "state"}">${esc(badge)}</span>
        <span class="tag cat">${esc(CATS[s.cat][lang])}</span>
      </div>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.summary)}</p>
      <span class="more">${esc(T.eli)} · ${esc(T.doc)} →</span>
    </article>`;
  }).join("");
}

/* ---- modal ---- */
let openId = null;
function fillList(el, items){ el.innerHTML = items.map(i => `<li>${esc(i)}</li>`).join(""); }

function openScheme(id){
  const s = SCHEMES.find(x => x.id === id);
  if (!s) return;
  const T = t();
  openId = id;
  const isC = s.state === "CENTRAL";
  $("m-tags").innerHTML =
    `<span class="tag ${isC ? "" : "state"}">${esc(isC ? T.badgeC : STATES[s.state][lang])}</span>` +
    `<span class="tag cat">${esc(CATS[s.cat][lang])}</span>`;
  $("m-title").textContent = s.name;
  $("m-sum").textContent = s.summary;
  fillList($("m-ben"), s.benefits);
  fillList($("m-eli"), s.eligibility);
  fillList($("m-doc"), s.documents);
  $("m-portal").href = s.portal;
  $("m-copy").textContent = T.copy;
  $("overlay").classList.add("open");
  try { history.replaceState(null, "", "#" + id); } catch(e){}
}

function closeScheme(){
  $("overlay").classList.remove("open");
  openId = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
}

/* ---- events ---- */
$("grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) openScheme(card.dataset.id);
});
$("grid").addEventListener("keydown", e => {
  if (e.key === "Enter"){
    const card = e.target.closest(".card");
    if (card) openScheme(card.dataset.id);
  }
});
$("close").addEventListener("click", closeScheme);
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeScheme(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeScheme(); });

["state","cat"].forEach(id => $(id).addEventListener("change", renderGrid));
$("q").addEventListener("input", renderGrid);

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  tab = b.dataset.t;
  $("tabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  renderGrid();
});

$("reset").addEventListener("click", () => {
  $("state").value = "ALL";
  $("cat").value = "ALL";
  $("q").value = "";
  tab = "all";
  $("tabs").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.t === "all"));
  renderGrid();
});

$("lang").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  lang = b.dataset.l;
  try { localStorage.setItem("sarkari_lang", lang); } catch(err){}
  renderStatic();
  renderSelects();
  renderGrid();
  if (openId) openScheme(openId);
});

$("m-copy").addEventListener("click", async () => {
  const url = location.origin + location.pathname + "#" + openId;
  try {
    await navigator.clipboard.writeText(url);
  } catch(e){
    const ta = document.createElement("textarea");
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(err){}
    document.body.removeChild(ta);
  }
  $("m-copy").textContent = t().copied;
  setTimeout(() => { if (openId) $("m-copy").textContent = t().copy; }, 1500);
});

/* ---- start ---- */
renderStatic();
renderSelects();
renderGrid();
if (location.hash.length > 1) openScheme(decodeURIComponent(location.hash.slice(1)));
</script>
